<!-- The nimki export window. Export copies the file's export; Sync from code takes what pnpm figma:out copied. Then run pnpm figma:in. -->
<style>
  body {
    font:
      12px/1.5 system-ui,
      sans-serif;
    margin: 12px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  button {
    padding: 6px 12px;
  }
  textarea {
    width: 100%;
    height: 90px;
    font:
      11px ui-monospace,
      monospace;
    box-sizing: border-box;
  }
  #status {
    margin: 8px 0;
  }
</style>
<div class="row">
  <button id="export" type="button">Export</button>
  <button id="sync" type="button">Sync from code</button>
</div>
<label for="paste">For Sync from code: paste what pnpm figma:out copied</label>
<textarea id="paste" aria-label="Sync data"></textarea>
<p id="status" role="status">Export copies the file for pnpm figma:in.</p>
<textarea id="out" readonly aria-label="Export"></textarea>
<script>
  const out = document.getElementById('out')
  const status = document.getElementById('status')
  const copy = () => {
    out.select()
    return document.execCommand('copy')
  }
  document.getElementById('export').addEventListener('click', () => {
    status.textContent = 'Exporting…'
    parent.postMessage({ pluginMessage: { type: 'export' } }, '*')
  })
  document.getElementById('sync').addEventListener('click', () => {
    status.textContent = 'Syncing from code…'
    parent.postMessage(
      { pluginMessage: { type: 'sync', text: document.getElementById('paste').value } },
      '*',
    )
  })
  onmessage = event => {
    const message = event.data.pluginMessage
    if (message.type === 'error') {
      status.textContent = message.text
      return
    }
    out.value = message.text
    const copied = copy()
    const lead =
      message.type === 'synced'
        ? message.changes.length === 0
          ? 'Already matched code. '
          : `Changed ${message.changes.length}: ${message.changes.join(', ')}. `
        : ''
    status.textContent =
      lead +
      (copied ? 'Export copied. Now run: pnpm figma:in' : 'Select the export below and copy it.')
  }
</script>
