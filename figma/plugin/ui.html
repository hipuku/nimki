<!-- The nimki export's window: shows the export and copies it. Then run pnpm figma:save --clipboard. -->
<style>
  body {
    font:
      12px/1.5 system-ui,
      sans-serif;
    margin: 12px;
  }
  textarea {
    width: 100%;
    height: 110px;
    font:
      11px ui-monospace,
      monospace;
  }
  button {
    margin-top: 8px;
    padding: 6px 12px;
  }
</style>
<p id="status">Exporting…</p>
<textarea id="out" readonly aria-label="Export"></textarea>
<button id="copy" type="button">Copy</button>
<script>
  const out = document.getElementById('out')
  const status = document.getElementById('status')
  const copy = () => {
    out.select()
    const done = document.execCommand('copy')
    status.textContent = done
      ? 'Copied. Now run: pnpm figma:save --clipboard'
      : 'Select the text and copy it by hand.'
  }
  onmessage = event => {
    out.value = event.data.pluginMessage
    copy()
  }
  document.getElementById('copy').addEventListener('click', copy)
</script>
