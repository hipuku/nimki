# Figma parity (master plan step 1.4c): code is the source of truth, and any
# difference between the Figma file and tokens/source fails here.
#
# 1. Values: the committed snapshot of the file (figma/snapshot/nimki.json)
#    against the variables and effect styles the source generates. Offline.
# 2. Freshness: the file's lastModified, read through Figma's REST API, must not
#    be later than the snapshot's export time, so the snapshot is never stale.
#    Needs the FIGMA_TOKEN secret (read-only). Fork pull requests get no
#    secrets, so it skips there with a notice; on main and our branches a
#    missing or refused token fails. It stays dormant until the first export
#    that carries a time.
#
# Runs on every push and pull request, and by hand from the Actions tab.
name: Figma parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figma-parity:
    name: Figma parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Variables and effect styles
        run: pnpm run figma:check
      - name: Freshness
        run: pnpm run figma:fresh
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_PARITY_REQUIRED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
