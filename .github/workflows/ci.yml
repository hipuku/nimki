# One job per check, named exactly as the main ruleset requires them. Only Lint
# exists until there is code to typecheck, test and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the names check reads every commit message and
      # author, not only the files at the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Names
        run: node scripts/check-names.mjs
