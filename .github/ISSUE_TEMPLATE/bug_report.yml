name: Bug report
description: Something does not work, or works differently from shadcn's original.
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Select
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a repository, a sandbox or the docs page that shows it.
    validations:
      required: true
  - type: dropdown
    id: settings
    attributes:
      label: Settings
      description: Which were on when it happened. Pick every one that applies.
      multiple: true
      options:
        - Light mode
        - Dark mode
        - Subtle motion
        - Expressive motion
        - Reduced motion
        - Comfortable density
        - Compact density
  - type: input
    id: environment
    attributes:
      label: Browser and system
      placeholder: Safari 26 on iOS 26
    validations:
      required: true
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched the open and closed issues and found none for this.
          required: true
